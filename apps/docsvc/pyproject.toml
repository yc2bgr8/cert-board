[project]
name = "cert-board-docsvc"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "defusedxml==0.7.1",
  "fastapi==0.165.0",
  "fonttools==4.68.0",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "opencv-python==5.0.0.93",
  "openpyxl==3.1.5",
  "pillow==13.0.0",
  "pypdf[crypto]==7.1.1",
  "pypdfium2==5.15.2",
  "python-docx==1.2.0",
  "rapidocr-onnxruntime==1.4.4",
  "uvicorn==0.54.0",
]

[dependency-groups]
test = ["httpx==0.28.1", "pytest==9.2.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/docsvc-pytest-cache"
