<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计稿：新对话（cert-board）</title>
<!-- cert-board 界面设计稿。说明见同目录 README.md，共用样式见 cb.css，截图见同名 png（1440 宽）。
     字体以 Inter 为准（应用内用 @fontsource/inter 打包）；本机没有 Inter 时会回落到系统字体。 -->
<link rel="stylesheet" href="cb.css">
<style>
body{margin:0}
a{color:#146b62}a:hover{color:#0f554e}
</style>
</head>
<body>
<div class="app" style="font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #142b2e">
  <aside class="side">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.89 6.18A7.6 7.6 0 1 0 15.89 17.82" stroke-width="1.9"></path><path d="M7.9 12.9L10.9 15.9L20.4 6.4" stroke-width="2.1"></path></svg></div>
      <div><div class="wordmark">cert<span class="hy">-</span>board</div><small>器械认证工作台</small></div>
    </div>
    <div class="side-actions">
      <button type="button" class="btn-new" style="border-color: #bfe0d6; background: #eaf5f1; color: #146b62"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>新对话</button>
      <button type="button" class="btn-sq" aria-label="搜索（Ctrl+K）"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </div>
    <a class="nav" href="#inbox"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>待我处理<span class="count">4</span></a>
    <div class="side-group">
      <div class="side-cap">助手</div>
      <a class="agent active" href="#reg"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span>注册Agent</a>
      <a class="agent" href="#mnt"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.940l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span>维护Agent</a>
      <a class="agent" href="#ext"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L13.9 8.6L19.5 10.5L13.9 12.4L12 18L10.1 12.4L4.5 10.5L10.1 8.6Z"></path><path d="M19 16v4M17 18h4"></path></svg></span>外部模型<span class="tag">外部</span></a>
    </div>
    <div class="side-group">
      <div class="side-cap">注册项目<button type="button" class="cap-btn" aria-label="新建注册项目"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
      <div class="tree">
        <a class="proj" href="#p1"><span class="chev"></span>L08 510(k)<span class="dot"></span></a>
        <a class="proj" href="#p2"><span class="chev"></span>CPAP 510(k)<span class="dot warn"></span></a>
        <a class="proj" href="#p3"><span class="chev"></span>JB-C1 加拿大 MDL</a>
      </div>
    </div>
    <div class="side-foot"><span class="avatar">张</span>张三<a class="foot-btn" href="#settings"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>设置</a></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="tb-left"><div><div class="crumb">注册Agent</div><div class="ttl">新对话</div></div></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px 120px">
      <div style="width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.3px">让注册Agent做什么？</h1>
        <div class="seg" role="radiogroup" aria-label="选择Agent">
          <button type="button" class="o on" role="radio" aria-checked="true"><span class="m-ava"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span><b>注册Agent</b><span>注册项目：立项、路径研判、申报包、发补答复</span></span></button>
          <button type="button" class="o" role="radio" aria-checked="false"><span class="m-ava" style="background: #f0f4f3; color: #4f6264"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span><span><b>维护Agent</b><span>维护事项：证照台账、年度注册、续期、上市后监测</span></span></button>
        </div>
        <div class="composer" style="position: relative">
          <textarea rows="3" aria-label="输入要交给注册Agent的事">检查L08申报包，列出缺件和前后不一致的地方，每条附两处原文</textarea>
          <div class="tools">
            <button type="button" class="ibtn" aria-label="添加附件"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
            <button type="button" class="pill">项目：不指定<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <button type="button" class="pill on" aria-expanded="true"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>完全允许<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <span class="hint">回车发送，Shift+回车换行</span>
            <button type="button" class="send" aria-label="发送"><svg class="i lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg></button>
          </div>
          <div class="menu" role="listbox" aria-label="权限模式" style="position: absolute; left: 168px; top: calc(100% + 6px); z-index: 3; width: 340px">
            <div class="opt" role="option" aria-selected="false"><span class="ck" style="margin-top: 2px"></span><span><b>只读</b><span>只读资料与检查，不修改文件或业务记录。</span></span></div>
            <div class="opt" role="option" aria-selected="false"><span class="ck" style="margin-top: 2px"></span><span><b>请求批准</b><span>可整理文件；写业务记录、发内部消息和关键判断前先请你批准。</span></span></div>
            <div class="opt on" role="option" aria-selected="true"><span class="ck done" style="margin-top: 2px"></span><span><b>完全允许（默认）</b><span>按依据继续工作；公司外部消息仍逐条批准，最终结果仍需审核。</span></span></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div class="muted small">常用</div>
          <div class="filters">
            <button type="button" class="fchip">检查L08申报包</button>
            <button type="button" class="fchip">拆解这封发补信</button>
            <button type="button" class="fchip">哪些证照90天内到期？</button>
            <button type="button" class="fchip">启动JB-C1加拿大注册</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
