<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .net { fill: none; stroke: #8aa0b8; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .box { fill: #ffffff; stroke: #5b7fa6; stroke-width: 1.3; }
      .core { fill: #fff6e5; stroke: #c98a1a; stroke-width: 1.3; }
      .store { fill: #f3f0fa; stroke: #6a5fb0; stroke-width: 1.3; }
      .ext { fill: #f7f7f7; stroke: #8c8c8c; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .model { fill: #eef8f0; stroke: #3f8f55; stroke-width: 1.3; }
      .web { fill: #eaf2ff; stroke: #2f5f98; stroke-width: 1.4; }
      .t { font-size: 13px; fill: #1f2d3d; }
      .tb { font-size: 14px; font-weight: bold; fill: #1f2d3d; }
      .tl { font-size: 13px; font-weight: bold; fill: #3d5a80; }
      .ts { font-size: 11.5px; fill: #4a5a6a; }
      .line { stroke: #5b6b7f; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .bus { stroke: #5b6b7f; stroke-width: 1.3; fill: none; }
    </style>
  </defs>

  <text x="30" y="30" class="tb" font-size="17">部署图（本机：Windows加WSL中的Docker；开发与最终部署在同一台电脑）</text>
  <rect x="40" y="50" width="200" height="62" rx="6" class="web"/>
  <text x="140" y="74" class="t" text-anchor="middle">浏览器</text>
  <text x="140" y="94" class="ts" text-anchor="middle">注册人员、管理层、销售</text>
  <text x="252" y="88" class="ts">只访问 backend-api（端口28080）</text>
  <rect x="30" y="150" width="1140" height="290" rx="10" class="net"/>
  <text x="42" y="168" class="tl">内部网络</text>
  <rect x="60" y="180" width="300" height="110" rx="6" class="core"/>
  <text x="210" y="204" class="tb" text-anchor="middle">backend-api（端口28080）</text>
  <text x="210" y="224" class="ts" text-anchor="middle">网页（React）、接口、事件流（SSE）</text>
  <text x="210" y="242" class="ts" text-anchor="middle">认证、审核与审批、技能发布</text>
  <text x="210" y="260" class="ts" text-anchor="middle">唯一对用户开放的服务</text>
  <rect x="390" y="180" width="340" height="110" rx="6" class="core"/>
  <text x="560" y="204" class="tb" text-anchor="middle">backend-worker</text>
  <text x="560" y="224" class="ts" text-anchor="middle">Agent内核（Pi 1.3）：对话、唤醒、评测</text>
  <text x="560" y="242" class="ts" text-anchor="middle">模型网关：按数据级别路由、计量、预算</text>
  <text x="560" y="260" class="ts" text-anchor="middle">定时与唤醒、导入与解析、邮件、外发队列</text>
  <rect x="760" y="180" width="180" height="110" rx="6" class="box"/>
  <text x="850" y="204" class="tb" text-anchor="middle">docsvc（Python）</text>
  <text x="850" y="224" class="ts" text-anchor="middle">PDF、Word、Excel、eSTAR</text>
  <text x="850" y="242" class="ts" text-anchor="middle">扫描页识别、按页渲染</text>
  <text x="850" y="260" class="ts" text-anchor="middle">转纯文字供改动对比</text>
  <rect x="970" y="180" width="180" height="110" rx="6" class="core"/>
  <text x="1060" y="204" class="tb" text-anchor="middle">egress（出网代理）</text>
  <text x="1060" y="224" class="ts" text-anchor="middle">后端访问外网的唯一出口</text>
  <text x="1060" y="242" class="ts" text-anchor="middle">按白名单放行</text>
  <rect x="160" y="320" width="300" height="100" rx="6" class="store"/>
  <text x="310" y="344" class="tb" text-anchor="middle">postgres（PostgreSQL 16 + 向量）</text>
  <text x="310" y="364" class="ts" text-anchor="middle">业务数据、对话与事件、工作区版本</text>
  <text x="310" y="382" class="ts" text-anchor="middle">维护端口 127.0.0.1:25432</text>
  <rect x="500" y="320" width="300" height="100" rx="6" class="store"/>
  <text x="650" y="344" class="tb" text-anchor="middle">minio（文件存储）</text>
  <text x="650" y="364" class="ts" text-anchor="middle">原始文件、工作区文件、网页存档、快照</text>
  <text x="650" y="382" class="ts" text-anchor="middle">管理界面 127.0.0.1:29001</text>
  <rect x="30" y="470" width="360" height="110" rx="10" class="net"/>
  <text x="42" y="488" class="tl">沙箱网段（没有出口）</text>
  <rect x="60" y="498" width="300" height="68" rx="6" class="box"/>
  <text x="210" y="522" class="t" text-anchor="middle">sandbox（代码沙箱）</text>
  <text x="210" y="542" class="ts" text-anchor="middle">Python与Office工具；无凭据；每次一个临时目录</text>
  <rect x="420" y="470" width="360" height="110" rx="10" class="net"/>
  <text x="432" y="488" class="tl">抓取网段</text>
  <rect x="450" y="498" width="300" height="68" rx="6" class="box"/>
  <text x="600" y="522" class="t" text-anchor="middle">fetcher（网页抓取）</text>
  <text x="600" y="542" class="ts" text-anchor="middle">检索、抓取、存档；只经出网代理访问外网</text>
  <rect x="800" y="470" width="328" height="110" rx="10" class="ext"/>
  <text x="812" y="488" class="tl">开发时</text>
  <text x="812" y="510" class="ts">Node应用在Windows上运行（界面28080、后端28081）</text>
  <text x="812" y="530" class="ts">依赖服务在WSL的Docker中，端口只绑定127.0.0.1</text>
  <text x="812" y="550" class="ts">中继容器转发内部服务的端口，它们仍不能出网</text>
  <rect x="30" y="610" width="760" height="130" rx="10" class="ext"/>
  <text x="42" y="628" class="tl">外部服务（只经出网代理访问）</text>
  <rect x="60" y="640" width="220" height="84" rx="6" class="model"/>
  <text x="170" y="664" class="t" text-anchor="middle">OpenRouter</text>
  <text x="170" y="684" class="ts" text-anchor="middle">开发阶段的模型上游</text>
  <text x="170" y="702" class="ts" text-anchor="middle">允许到「内部」级别</text>
  <rect x="300" y="640" width="220" height="84" rx="6" class="box"/>
  <text x="410" y="664" class="t" text-anchor="middle">openFDA、AccessGUDID</text>
  <text x="410" y="684" class="ts" text-anchor="middle">企业注册与列名、510(k)</text>
  <text x="410" y="702" class="ts" text-anchor="middle">产品分类、GUDID</text>
  <rect x="540" y="640" width="220" height="84" rx="6" class="box"/>
  <text x="650" y="664" class="t" text-anchor="middle">企业微信</text>
  <text x="650" y="684" class="ts" text-anchor="middle">发送提醒</text>
  <text x="650" y="702" class="ts" text-anchor="middle">接收回复待IT确认</text>
  <rect x="820" y="610" width="350" height="130" rx="10" class="ext"/>
  <text x="832" y="628" class="tl">公司内网（以后）</text>
  <rect x="850" y="640" width="290" height="84" rx="6" class="model"/>
  <text x="995" y="664" class="t" text-anchor="middle">自部署本地模型</text>
  <text x="995" y="684" class="ts" text-anchor="middle">OpenAI兼容接口；允许到「保密」级别</text>
  <text x="995" y="702" class="ts" text-anchor="middle">验收通过后在模型网关中启用</text>
  <path d="M140,112 L140,178" class="line"/>
  <path d="M360,235 L388,235" class="line"/>
  <path d="M730,235 L758,235" class="line"/>
  <path d="M560,180 L560,165 L1060,165 L1060,178" class="line"/>
  <path d="M200,290 L250,318" class="line"/>
  <path d="M430,290 L400,318" class="line"/>
  <path d="M620,290 L650,318" class="line"/>
  <path d="M480,290 L480,460 L210,460 L210,496" class="line"/>
  <path d="M720,290 L720,305 L830,305 L830,455 L600,455 L600,496" class="line"/>
  <path d="M750,520 L795,520 L795,445 L1100,445 L1100,292" class="line"/>
  <path d="M1140,290 L1140,598 L170,598" class="bus"/>
  <path d="M170,598 L170,638" class="line"/>
  <path d="M410,598 L410,638" class="line"/>
  <path d="M650,598 L650,638" class="line"/>
  <path d="M995,598 L995,638" class="line"/>
  <text x="30" y="768" class="ts">说明：浏览器只访问backend-api；Agent内核在backend-worker中运行，所有模型请求经其中的模型网关，再经出网代理访问上游。</text>
  <text x="30" y="788" class="ts">代码只在沙箱中运行（没有出口、没有凭据）；fetcher只经出网代理访问外网。橙色框执行约束，紫色框是存储，绿色框是模型，蓝色框是界面。</text>
</svg>
