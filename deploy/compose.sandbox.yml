name: cert-board-sandbox

x-read-only: &read-only
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  sandbox:
    <<: *read-only
    init: true
    image: cert-board-sandbox-runtime
    build:
      context: ./apps/sandbox
      target: runtime
    networks: [sandbox-only]
    tmpfs: ['/scratch:size=256m,nr_inodes=4096,uid=65532,gid=65532,mode=0700']
    mem_limit: 1g
    cpus: 2
    pids_limit: 96
    ipc: none
    healthcheck:
      test:
        [
          CMD,
          python,
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:28083/health",timeout=2).close()',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sandbox-relay:
    <<: *read-only
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    entrypoint: [nginx, '-g', 'daemon off;']
    tmpfs: [/tmp]
    depends_on:
      sandbox:
        condition: service_healthy
    networks:
      sandbox-only: {}
      sandbox-ingress:
        aliases: [sandbox-relay-entry]
    ports: ['127.0.0.1:28083:28083']
    volumes:
      - ./deploy/relay/sandbox.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

networks:
  sandbox-only:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  sandbox-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
