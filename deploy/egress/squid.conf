http_port 3128
visible_hostname cert-board-egress
pid_filename /tmp/squid.pid
coredump_dir /tmp
hosts_file /etc/squid/hosts

acl allowed_domains dstdomain -n "/etc/squid/allowlist"
acl secure_ports port 443
acl tunnel_method method CONNECT
acl private_destinations dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32

# 先拒绝非白名单名字，不为任意拒绝请求进行反向解析或连接。
http_access deny !tunnel_method
http_access deny !secure_ports
http_access deny !allowed_domains
http_access deny private_destinations
http_access allow allowed_domains
http_access deny all

# CONNECT 不解密 TLS；不持有上游凭据，不记录路径、请求头或请求正文。
logformat cert_gateway %ts.%03tu %rm %>rd %>rP %>Hs %Ss
access_log stdio:/dev/stdout cert_gateway
cache_log /dev/null
cache_store_log none
cache deny all
logfile_rotate 0
netdb_filename none
pinger_enable off
forwarded_for delete
shutdown_lifetime 1 seconds
