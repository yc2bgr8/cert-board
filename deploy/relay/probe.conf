worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 64; }

stream {
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_timeout 10s;

    upstream doc_probe {
        zone doc_probe 64k;
        server doc-probe:8080 resolve;
    }
    upstream sandbox_probe {
        zone sandbox_probe 64k;
        server sandbox-probe:8080 resolve;
    }
    upstream fetch_probe {
        zone fetch_probe 64k;
        server fetch-probe:8080 resolve;
    }

    server { listen probe-relay-ingress:28082; proxy_pass doc_probe; }
    server { listen probe-relay-ingress:28083; proxy_pass sandbox_probe; }
    server { listen probe-relay-ingress:28084; proxy_pass fetch_probe; }
}
