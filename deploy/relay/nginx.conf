worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

stream {
    # 目标固定在内部服务，不接收客户端指定的主机名或转发地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream database {
        zone database 64k;
        server postgres:5432 resolve;
    }
    upstream object_storage {
        zone object_storage 64k;
        server minio:9000 resolve;
    }
    upstream storage_console {
        zone storage_console 64k;
        server minio:9001 resolve;
    }

    proxy_connect_timeout 5s;
    proxy_timeout 1h;

    server {
        listen 5432;
        proxy_pass database;
    }
    server {
        listen 9000;
        proxy_pass object_storage;
    }
    server {
        listen 9001;
        proxy_pass storage_console;
    }
}
