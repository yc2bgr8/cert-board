worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 64; }

stream {
    resolver 127.0.0.11 valid=3s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_timeout 420s;
    upstream document_api {
        zone document_api 64k;
        server docsvc:28082 resolve;
    }
    server { listen docsvc-relay-entry:28082; proxy_pass document_api; }
}
