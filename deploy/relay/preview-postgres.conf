worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream preview_database {
        zone preview_database 64k;
        server postgres:5432 resolve;
    }
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    server {
        listen 5432;
        proxy_pass preview_database;
    }
}
