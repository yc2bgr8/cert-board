worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 64; }

stream {
    resolver 127.0.0.11 valid=3s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_timeout 16s;
    upstream fetcher_api {
        zone fetcher_api 64k;
        server fetcher:28084 resolve;
    }
    server { listen fetch-relay-entry:28084; proxy_pass fetcher_api; }
}
