worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 64; }

stream {
    resolver 127.0.0.11 valid=3s ipv6=off;
    proxy_connect_timeout 3s;
    proxy_timeout 180s;
    upstream sandbox_api {
        zone sandbox_api 64k;
        server sandbox:28083 resolve;
    }
    server { listen sandbox-relay-entry:28083; proxy_pass sandbox_api; }
}
