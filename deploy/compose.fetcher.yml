name: cert-board-fetcher

x-read-only: &read-only
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

services:
  fetcher:
    <<: *read-only
    image: cert-board-fetcher-runtime
    build:
      context: ./apps/fetcher
      target: runtime
    networks: [fetch]
    environment:
      CERT_SEARXNG_ENABLED: ${CERT_SEARXNG_ENABLED:-0}
    depends_on:
      fetch-egress:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:28084/health",timeout=2).close()',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fetch-egress:
    <<: *read-only
    image: cert-board-fetch-egress
    build:
      context: ./deploy/egress
      target: web-fetch
    networks: [fetch, fetch-outbound]
    healthcheck:
      test: ['CMD', 'squid', '-k', 'check', '-f', '/etc/squid/squid.conf']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fetch-relay:
    <<: *read-only
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    entrypoint: ['nginx', '-g', 'daemon off;']
    depends_on:
      fetcher:
        condition: service_healthy
    networks:
      fetch: {}
      fetch-ingress:
        aliases: [fetch-relay-entry]
    ports: ['127.0.0.1:28084:28084']
    volumes:
      - ./deploy/relay/fetcher.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

networks:
  fetch:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  fetch-ingress:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
  fetch-outbound: {}
